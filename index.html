<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natee 組織図ツール</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#f2f1ed;--sur:#fff;--bor:#e2dfd7;--txt:#1a1815;--sub:#7a746d;
  --acc:#e8521a;--acc-l:#fdf0eb;
  --ny:#16a34a;--ny-l:#dcfce7;
  --id:#2563eb;--id-l:#dbeafe;
  --km:#7c3aed;--km-l:#ede9fe;
  --kr:#b91c1c;--kr-l:#fef2f2;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}

/* HEADER */
header{background:var(--sur);border-bottom:1px solid var(--bor);padding:0 14px;display:flex;align-items:center;height:50px;position:sticky;top:0;z-index:100;gap:7px;}
.logo{font-size:14px;font-weight:900;white-space:nowrap;margin-right:4px;}.logo em{color:var(--acc);font-style:normal;}
.tabs{display:flex;gap:2px;flex:1;}
.tab{padding:5px 10px;border:none;background:transparent;border-radius:5px;font-size:11px;font-family:inherit;cursor:pointer;color:var(--sub);font-weight:600;transition:all .15s;white-space:nowrap;}
.tab.on{background:var(--acc);color:#fff;}.tab:hover:not(.on){background:var(--bor);}
.hbts{display:flex;gap:4px;}
.btn{padding:5px 10px;border-radius:6px;font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-g{background:transparent;color:var(--sub);border:1px solid var(--bor);}.btn-g:hover{background:var(--bor);}
.btn-p{background:var(--acc);color:#fff;}.btn-p:hover{background:#c94312;}
.btn-warn{background:var(--kr-l);color:var(--kr);border:1px solid #fecaca;}.btn-warn:hover{background:var(--kr);color:#fff;}
.btn-snap{background:#fef9c3;color:#854d0e;border:1px solid #fde68a;}.btn-snap:hover{background:#fde68a;}

/* LAYOUT */
main{display:flex;height:calc(100vh - 50px);}

/* SIDEBAR */
aside{width:230px;min-width:230px;background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;overflow:hidden;}
.sb-hd{padding:10px;border-bottom:1px solid var(--bor);}
.sb-label{font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;}
.sb-input{width:100%;padding:4px 7px;border:1.5px solid var(--bor);border-radius:5px;font-size:11px;font-family:inherit;outline:none;margin-bottom:7px;}
.sb-input:focus{border-color:var(--acc);}
.sb-div-label{font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;margin-top:2px;}
.gl{flex:1;overflow-y:auto;padding:5px;}
.gi{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--rs);cursor:pointer;transition:all .15s;margin-bottom:1px;border:1.5px solid transparent;}
.gi:hover{background:var(--bg);}.gi.on{background:var(--acc-l);border-color:rgba(232,82,26,.25);}
.gi-drag{font-size:14px;color:var(--bor);cursor:grab;flex-shrink:0;user-select:none;}.gi:hover .gi-drag{color:var(--sub);}
.gi.drag-over{background:var(--acc-l);border-color:var(--acc);}
.gi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.gi-name{font-size:11px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gi-cnt{font-size:10px;color:var(--sub);font-family:'DM Mono',monospace;flex-shrink:0;}
.gi-del{width:18px;height:18px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:11px;color:transparent;padding:0;flex-shrink:0;transition:all .15s;}
.gi:hover .gi-del{color:var(--sub);}.gi-del:hover{background:#fee2e2;color:#dc2626 !important;}
.add-g-btn{width:100%;padding:7px;border:1.5px dashed var(--bor);border-radius:var(--rs);background:transparent;font-size:11px;color:var(--sub);cursor:pointer;font-family:inherit;transition:all .15s;margin-top:4px;}
.add-g-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-l);}

/* EDITOR */
.editor{flex:1;overflow-y:auto;padding:16px 20px;}
.fw{margin-bottom:11px;}
.fl{font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.fi{width:100%;padding:6px 9px;border:1.5px solid var(--bor);border-radius:6px;font-size:13px;font-family:inherit;outline:none;background:#fff;transition:border-color .15s;}
.fi:focus{border-color:var(--acc);}
.fi.big{font-size:17px;font-weight:900;}
.stat-bar{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.stpill{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;background:var(--sur);border-radius:20px;padding:3px 8px;border:1.5px solid var(--bor);}

/* チーム（section） */
.sec{background:var(--sur);border:1.5px solid var(--bor);border-radius:var(--r);margin-bottom:10px;}
.sec-hd{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1.5px solid var(--bor);background:#fafaf8;border-radius:var(--r) var(--r) 0 0;}
.sec-nw{flex:1;}
.sec-nl{font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.sec-ni{width:100%;padding:4px 7px;border:1.5px solid var(--bor);border-radius:4px;font-size:12px;font-weight:700;font-family:inherit;outline:none;background:#fff;}
.sec-ni:focus{border-color:var(--acc);}
.sec-del{width:22px;height:22px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--sub);flex-shrink:0;}
.newtag-btn{padding:3px 8px;border-radius:4px;border:1.5px solid var(--bor);background:#fff;color:var(--sub);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .15s;}
.newtag-btn.on{background:#ea580c;color:#fff;border-color:#ea580c;}
.newtag-btn:hover:not(.on){background:#fff7ed;border-color:#ea580c;color:#ea580c;}
.sec-del:hover{background:#fee2e2;color:#dc2626;}
.sec-body{padding:10px 12px;}

/* ユニット（unit） */
.unit{background:#f8f7f3;border:1.5px solid var(--bor);border-radius:var(--rs);margin-bottom:8px;border-left:3px solid var(--acc);}
.unit-hd{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid var(--bor);}
.unit-nw{flex:1;}
.unit-nl{font-size:8px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.unit-ni{width:100%;padding:3px 6px;border:1.5px solid var(--bor);border-radius:4px;font-size:11px;font-weight:700;font-family:inherit;outline:none;background:#fff;}
.unit-ni:focus{border-color:var(--acc);}
.unit-del{width:20px;height:20px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--sub);flex-shrink:0;}
.unit-del:hover{background:#fee2e2;color:#dc2626;}
.unit-body{padding:8px 10px;}
.add-unit-btn{width:100%;padding:5px;border:1.5px dashed var(--bor);border-radius:var(--rs);background:transparent;font-size:10px;color:var(--sub);cursor:pointer;font-family:inherit;transition:all .15s;margin-top:4px;}
.add-unit-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-l);}

/* メンバー行 */
.mlist{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.mrow{display:flex;align-items:center;gap:5px;border:1.5px solid var(--bor);border-radius:6px;padding:5px 8px;flex-wrap:wrap;background:#fafaf8;transition:all .15s;}
.mrow.ch-ny{border-color:var(--ny);background:var(--ny-l);}
.mrow.ch-id{border-color:var(--id);background:var(--id-l);}
.mrow.ch-km_add{border-color:var(--km);background:var(--km-l);}
.mrow.ch-km_del{border-color:var(--kr);background:var(--kr-l);}
.m-name-wrap{display:flex;align-items:center;gap:4px;min-width:72px;flex-shrink:0;}
.m-name{font-size:12px;font-weight:700;}
.m-drag{font-size:12px;color:var(--bor);cursor:grab;flex-shrink:0;user-select:none;}
.mrow:hover .m-drag{color:var(--sub);}
.mrow.dragging{opacity:.4;}
.drop-target{background:var(--acc-l) !important;outline:2px dashed var(--acc);outline-offset:-2px;}
.km-badge{font-size:9px;font-weight:700;background:var(--km);color:#fff;padding:1px 4px;border-radius:3px;white-space:nowrap;}
.km-toggle{padding:2px 6px;border-radius:4px;border:1.5px solid var(--bor);background:#fff;color:var(--sub);font-size:9px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .15s;}
.km-toggle.on{background:var(--km);color:#fff;border-color:var(--km);}
.km-toggle:hover:not(.on){border-color:var(--km);color:var(--km);}
.role-grp{display:flex;gap:3px;flex-wrap:wrap;flex:1;}
.rc{padding:2px 5px;border-radius:4px;border:1.5px solid var(--bor);font-size:9px;font-weight:700;cursor:pointer;background:#fff;color:var(--sub);transition:all .15s;font-family:inherit;}
.rc.on-bucho{background:#1a1815;color:#fff;border-color:#1a1815;}
.rc.on-mgr{background:#0f766e;color:#fff;border-color:#0f766e;}
.rc.on-leader{background:#0891b2;color:#fff;border-color:#0891b2;}
.rc.on-member{background:#94a3b8;color:#fff;border-color:#94a3b8;}
.rc.on-gyomu{background:#d97706;color:#fff;border-color:#d97706;}
.ch-grp{display:flex;gap:3px;flex-shrink:0;}
.cc{padding:2px 5px;border-radius:4px;border:1.5px solid var(--bor);font-size:9px;font-weight:700;cursor:pointer;background:#fff;color:var(--sub);transition:all .15s;font-family:inherit;}
.cc.on-ny{background:var(--ny);color:#fff;border-color:var(--ny);}
.cc.on-id{background:var(--id);color:#fff;border-color:var(--id);}
.cc.on-km_add{background:var(--km);color:#fff;border-color:var(--km);}
.cc.on-km_del{background:var(--kr);color:#fff;border-color:var(--kr);}
.m-del{width:16px;height:16px;border-radius:50%;border:none;background:rgba(0,0,0,.08);cursor:pointer;font-size:9px;color:var(--sub);flex-shrink:0;padding:0;}
.m-del:hover{background:#fca5a5;color:#991b1b;}

/* メンバー追加エリア */
.add-area{background:var(--bg);border-radius:var(--rs);border:2px dashed var(--bor);padding:8px 10px;}
.add-area-lbl{font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.add-row{display:flex;gap:5px;align-items:flex-end;flex-wrap:wrap;}
.af{display:flex;flex-direction:column;gap:2px;}
.af-lbl{font-size:9px;font-weight:600;color:var(--sub);}
.af input,.af select{padding:5px 7px;border:1.5px solid var(--bor);border-radius:5px;font-size:11px;font-family:inherit;outline:none;background:#fff;}
.af input{width:100px;}.af input:focus,.af select:focus{border-color:var(--acc);}
.master-dropdown{position:absolute;z-index:200;background:#fff;border:1.5px solid var(--bor);border-radius:7px;max-height:200px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:160px;}
.master-item{padding:7px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--bor);}
.master-item:last-child{border-bottom:none;}.master-item:hover{background:var(--acc-l);color:var(--acc);}
.master-item em{font-style:normal;color:var(--sub);font-size:10px;margin-left:5px;}
.add-sub{align-self:flex-end;padding:5px 11px;border-radius:5px;border:none;background:var(--acc);color:#fff;font-size:11px;font-family:inherit;font-weight:700;cursor:pointer;}

/* TREE */
.tree-panel{flex:1;overflow:auto;padding:20px 28px;background:var(--bg);}
.tlg{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.tl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);}
.tldot{width:7px;height:7px;border-radius:50%;}
.t-root-node{display:inline-flex;flex-direction:column;gap:3px;margin-bottom:16px;}
.t-company{display:inline-block;background:var(--txt);color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:900;}
.t-division{display:inline-block;background:#334155;color:#fff;border-radius:6px;padding:5px 14px;font-size:11px;font-weight:700;}
/* 部門 */
.t-tree-wrap{display:flex;flex-direction:column;border-left:2px solid var(--bor);margin-left:24px;padding:6px 0 2px;gap:0;}
.t-div-row{display:flex;align-items:flex-start;margin-bottom:10px;}
.t-div-hline{width:22px;height:2px;margin-top:17px;flex-shrink:0;}
.t-div-box{border:2px solid;border-radius:8px;padding:7px 12px;min-width:160px;}
.t-div-name{font-size:12px;font-weight:900;}
.t-div-sub{font-size:9px;color:var(--sub);margin-top:1px;}
/* チーム */
.t-sec-wrap{display:flex;flex-direction:column;border-left:2px solid var(--bor);margin-left:10px;margin-top:6px;padding:3px 0;gap:0;}
.t-sec-row{display:flex;align-items:flex-start;margin-bottom:5px;}
.t-sec-hline{width:16px;height:2px;margin-top:15px;flex-shrink:0;}
.t-sec-box{border:1.5px solid var(--bor);border-radius:6px;padding:6px 10px;background:var(--sur);min-width:130px;max-width:240px;}
.t-sec-name{font-size:11px;font-weight:800;margin-bottom:3px;}
/* ユニット */
.t-unit-wrap{display:flex;flex-direction:column;border-left:2px solid var(--bor);margin-left:10px;margin-top:4px;padding:2px 0;gap:0;}
.t-unit-row{display:flex;align-items:flex-start;margin-bottom:4px;}
.t-unit-hline{width:12px;height:2px;margin-top:13px;flex-shrink:0;}
.t-unit-box{border:1.5px solid var(--bor);border-radius:5px;padding:5px 9px;background:#fafaf8;min-width:120px;max-width:230px;}
.t-unit-name{font-size:10px;font-weight:700;color:var(--acc);margin-bottom:3px;}
/* メンバー表示 */
.t-members{font-size:10px;line-height:1.85;color:var(--sub);}
.tm{display:inline;}.tm+.tm::before{content:'・';}
.tm.ny{color:var(--ny);font-weight:700;}.tm.id{color:var(--id);font-weight:600;}
.tm.km_add{color:var(--km);font-weight:700;}.tm.km_del{color:var(--kr);}
.rb{font-size:7px;font-weight:700;padding:1px 3px;border-radius:2px;color:#fff;vertical-align:middle;margin-right:2px;display:inline-block;}
.rb-bucho{background:#1a1815;}.rb-mgr{background:#0f766e;}.rb-leader{background:#0891b2;}.rb-gyomu{background:#d97706;}
.t-km{font-size:7px;font-weight:700;background:var(--km);color:#fff;border-radius:2px;padding:0 2px;vertical-align:middle;margin-left:1px;}

/* SLIDE */
.sl-outer{flex:1;overflow:auto;background:#c8c5bc;padding:18px;}
.sl-nav{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
.sl-nav-lbl{font-size:11px;font-weight:700;color:#555;white-space:nowrap;}
.stabs{display:flex;gap:3px;flex-wrap:wrap;}
.stab{padding:4px 9px;border:1.5px solid #aaa;border-radius:5px;font-size:10px;font-family:inherit;cursor:pointer;background:#fff;color:var(--sub);font-weight:600;transition:all .15s;}
.stab.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.sldv{width:960px;min-height:540px;background:#fff;border-radius:6px;box-shadow:0 6px 28px rgba(0,0,0,.22);position:relative;overflow:hidden;display:none;}
.sldv.on{display:block;}
.sl-bar{position:absolute;top:0;left:0;width:100%;height:7px;}
.sl-p{padding:28px 36px;}
.sl-ey{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
.sl-h1{font-size:28px;font-weight:900;line-height:1.1;margin-bottom:3px;}
.sl-meta{font-size:11px;color:var(--sub);margin-bottom:16px;display:flex;gap:11px;flex-wrap:wrap;align-items:center;}
.sl-meta-chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
/* スライドのチーム行 */
.sl-ll{display:grid;gap:5px;}
.sl-team-block{margin-bottom:7px;}
.sl-team-label{font-size:11px;font-weight:900;color:var(--acc);margin-bottom:3px;padding-left:4px;border-left:3px solid var(--acc);}
.sl-lrow{display:grid;grid-template-columns:90px 1fr;border-radius:4px;overflow:hidden;border:1.5px solid #eee;margin-bottom:3px;}
.sl-ltag{color:#fff;font-size:11px;font-weight:700;padding:6px 8px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;}
.sl-lnames{padding:5px 9px;font-size:11px;line-height:2;background:#fafaf8;}
/* チーム直属メンバー（ユニットなし）行 */
.sl-team-row{display:grid;grid-template-columns:90px 1fr;border-radius:4px;overflow:hidden;border:1.5px solid #eee;margin-bottom:3px;}
.sl-team-tag{font-size:11px;font-weight:700;padding:6px 8px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;color:#fff;}
.slm{display:inline;}.slm+.slm::before{content:'　'}
.slm.ny{color:var(--ny);font-weight:700;}.slm.id{color:var(--id);font-weight:600;}
.slm.km_add{color:var(--km);font-weight:700;}.slm.km_del{color:var(--kr);}
.slrb{font-size:8px;font-weight:700;padding:0 3px;border-radius:2px;color:#fff;vertical-align:middle;margin-right:2px;}
.slrb-bucho{background:#1a1815;}.slrb-mgr{background:#0f766e;}.slrb-leader{background:#0891b2;}.slrb-gyomu{background:#d97706;}
.sl-km-mark{font-size:7px;font-weight:700;background:var(--km);color:#fff;border-radius:2px;padding:0 2px;vertical-align:middle;margin-left:1px;}
.sl-leg{position:absolute;bottom:12px;right:28px;display:flex;gap:10px;font-size:8px;color:var(--sub);}
.sll{display:flex;align-items:center;gap:3px;}.slld{width:6px;height:6px;border-radius:50%;}

/* 発令案 */
.hp{flex:1;overflow-y:auto;padding:16px 20px;}
.hn{background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:8px 12px;font-size:11px;color:#92400e;line-height:1.6;margin-bottom:14px;}
.hs{margin-bottom:22px;}
.hsh{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.hb{padding:4px 9px;border-radius:5px;font-size:11px;font-weight:700;}
.hb.ny{background:var(--ny-l);color:var(--ny);}.hb.id{background:var(--id-l);color:var(--id);}
.hb.km{background:var(--km-l);color:var(--km);}.hb.kr{background:var(--kr-l);color:var(--kr);}
.cab{padding:4px 9px;border-radius:5px;border:1px solid var(--bor);background:#fff;font-size:11px;font-family:inherit;cursor:pointer;}
.cab:hover{background:var(--acc);color:#fff;border-color:var(--acc);}
table.ht{width:100%;border-collapse:collapse;font-size:11px;}
table.ht th{background:#f0ede7;padding:5px 7px;text-align:left;font-size:10px;font-weight:700;color:var(--sub);border:1px solid var(--bor);white-space:nowrap;}
table.ht td{padding:5px 7px;border:1px solid var(--bor);background:#fff;}
table.ht tr:hover td{background:#fafaf8;}
.cr{padding:2px 6px;border:1px solid var(--bor);border-radius:3px;background:#fff;font-size:10px;cursor:pointer;font-family:inherit;}
.cr:hover{background:var(--acc);color:#fff;border-color:var(--acc);}
.emp{font-size:12px;color:var(--sub);padding:7px 0;}

/* マスタ */
.master-panel{flex:1;overflow-y:auto;padding:16px 20px;}
.master-search{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.master-search input{padding:7px 11px;border:1.5px solid var(--bor);border-radius:7px;font-size:12px;font-family:inherit;outline:none;width:220px;}
.master-search input:focus{border-color:var(--acc);}
.master-table{width:100%;border-collapse:collapse;font-size:12px;}
.master-table th{background:#f0ede7;padding:6px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--sub);border:1px solid var(--bor);white-space:nowrap;}
.master-table td{padding:6px 10px;border:1px solid var(--bor);background:#fff;vertical-align:middle;}
.master-table tr:hover td{background:#fafaf8;}
.master-table input{width:100%;border:1px solid transparent;background:transparent;font-size:12px;font-family:inherit;outline:none;padding:2px 4px;border-radius:3px;}
.master-table input:focus{border-color:var(--acc);background:#fff;}
.master-table select{width:100%;border:1px solid transparent;background:transparent;font-size:11px;font-family:inherit;outline:none;cursor:pointer;}
.master-table select:focus{border-color:var(--acc);background:#fff;}
.m-del-row{width:22px;height:22px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--sub);}
.m-del-row:hover{background:#fee2e2;color:#dc2626;}

/* MODAL */

// ── アーカイブ構造 ──
// 各月: { label, snapshot, snapshotDate, companyName, divisionName, master, groups }
// Dは「現在表示中の月」のデータを指す
let ARCHIVES = [];
let curArchive = 0;

// 初期データDを最初のアーカイブとして登録
const LS_KEY = 'natee_org_data_v1';
let autosaveReady = false; // 起動シーケンス完了までは自動保存しない（誤上書き防止）
// localStorageに全アーカイブを自動保存
function autosave(){
  if(!autosaveReady) return; // 起動完了前は保存しない
  try{
    syncDToArchive();
    localStorage.setItem(LS_KEY, JSON.stringify({__archives:ARCHIVES, __cur:curArchive}));
  }catch(e){/* 容量超過などは無視 */}
}
// localStorageから復元（あればtrue）
function restoreFromLS(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(parsed.__archives && parsed.__archives.length){
      ARCHIVES = parsed.__archives;
      curArchive = parsed.__cur || 0;
      loadArchiveToD(curArchive);
      return true;
    }
  }catch(e){}
  return false;
}

function initArchives(){
  const now = new Date();
  const defaultLabel = now.getFullYear() + '年' + (now.getMonth()+1) + '月';
  ARCHIVES = [{
    label: D.archiveLabel || defaultLabel,
    companyName: D.companyName,
    divisionName: D.divisionName,
    snapshot: D.snapshot || null,
    snapshotDate: D.snapshotDate || null,
    master: D.master,
    groups: D.groups,
  }];
  curArchive = 0;
}

// 現在のDを今のアーカイブに書き戻す
function syncDToArchive(){
  syncDefsToD();
  const a = ARCHIVES[curArchive];
  if(!a) return;
  a.companyName = D.companyName;
  a.divisionName = D.divisionName;
  a.snapshot = D.snapshot;
  a.snapshotDate = D.snapshotDate;
  a.master = D.master;
  a.groups = D.groups;
}

// アーカイブからDを読み込む
function loadArchiveToD(idx){
  const a = ARCHIVES[idx];
  if(!a) return;
  D.archiveLabel = a.label;
  D.companyName = a.companyName;
  D.divisionName = a.divisionName;
  D.snapshot = a.snapshot;
  D.snapshotDate = a.snapshotDate;
  D.master = a.master;
  D.groups = a.groups;
  // 役職・変更区分の定義はアーカイブ共通でDに保持
  loadDefsFromD();
  curArchive = idx;
  aG = D.groups[0]?.id || '';
}

// 月を切り替え
function switchArchive(idx){
  syncDToArchive();
  loadArchiveToD(idx);
  renderArchiveBar();
  renderAll();
  autosave();
  toast('📅 ' + ARCHIVES[idx].label + ' に切り替えました');
}

// 今の月をコピーして新規作成
function newArchiveFromCurrent(){
  syncDToArchive();
  const now = new Date();
  const suggested = now.getFullYear() + '年' + (now.getMonth()+1) + '月';
  const label = prompt('新しい月の名前を入力してください', suggested);
  if(!label) return;
  // 現在のアーカイブを深コピー
  const cur = ARCHIVES[curArchive];
  const copy = JSON.parse(JSON.stringify({
    label: label,
    companyName: cur.companyName,
    divisionName: cur.divisionName,
    snapshot: null,  // 新月はスナップショットなしから
    snapshotDate: null,
    master: cur.master,
    groups: cur.groups,
  }));
  // 変更区分(ch)はリセット（新しい月なので）
  copy.groups.forEach(g=>g.sections.forEach(s=>{
    s.members.forEach(m=>{m.ch='';});
    s.units.forEach(u=>u.members.forEach(m=>{m.ch='';}));
  }));
  ARCHIVES.push(copy);
  loadArchiveToD(ARCHIVES.length-1);
  renderArchiveBar();
  renderAll();
  toast('📅 ' + label + ' を作成しました（前月ベース）');
}

// 月名変更
function renameArchive(){
  const a = ARCHIVES[curArchive];
  if(!a) return;
  const label = prompt('月の名前を変更', a.label);
  if(!label) return;
  a.label = label;
  D.archiveLabel = label;
  renderArchiveBar();
  autosave();
  toast('月名を変更しました');
}

// 月削除
function deleteArchive(idx){
  if(ARCHIVES.length<=1){ toast('最後の1つは削除できません'); return; }
  if(!confirm('「'+ARCHIVES[idx].label+'」を削除しますか？')) return;
  ARCHIVES.splice(idx,1);
  if(curArchive>=ARCHIVES.length) curArchive=ARCHIVES.length-1;
  else if(curArchive>idx) curArchive--;
  loadArchiveToD(curArchive);
  renderArchiveBar();
  renderAll();
  toast('削除しました');
}

// ── メンバー ドラッグ&ドロップ移動（同一部門内のみ） ──
let memberDrag=null; // {type,id,name}
function findGroupOfContainer(type,id){
  // type/idのコンテナが属する部門を返す
  for(const g of D.groups){
    for(const s of g.sections){
      if(type==='sec'&&s.id===id) return g;
      if(type==='unit'){ if(s.units.find(u=>u.id===id)) return g; }
    }
  }
  return null;
}
function memberDragStart(e,type,id,name){
  memberDrag={type,id,name};
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',name);}catch(_){}
}
function memberDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
}
function memberDragOver(e){
  if(!memberDrag)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drop-target');
}
function memberDragLeave(e){
  e.currentTarget.classList.remove('drop-target');
}
function memberDrop(e,destType,destId){
  e.preventDefault();
  e.currentTarget.classList.remove('drop-target');
  if(!memberDrag)return;
  const {type:srcType,id:srcId,name}=memberDrag;
  memberDrag=null;
  // 同じ場所なら何もしない
  if(srcType===destType&&srcId===destId)return;
  // 同一部門内のみ許可
  const srcG=findGroupOfContainer(srcType,srcId);
  const destG=findGroupOfContainer(destType,destId);
  if(!srcG||!destG){toast('❌ 移動先が見つかりません');return;}
  if(srcG.id!==destG.id){toast('⚠️ 移動は同じ部門内のみ可能です');return;}
  // 元リストから取り出し
  const srcList=getMemberList(srcType,srcId);
  const destList=getMemberList(destType,destId);
  if(!srcList||!destList)return;
  const i=srcList.findIndex(x=>x.n===name);
  if(i<0)return;
  // 移動元の所属情報を取得（異動前として記録）
  let srcSecName='', srcUnitName='';
  if(srcType==='sec'){const r=findSec(srcId);if(r)srcSecName=r.s.name;}
  else if(srcType==='unit'){const r=findUnit(srcId);if(r){srcSecName=r.s.name;srcUnitName=r.u.name;}}
  const [m]=srcList.splice(i,1);
  // 移動したら自動で「異動」をセット（手動で解除可能）
  m.ch='id';
  // 異動前情報を記録（既にfromがあれば最初の移動元を保持）
  if(!m.from){
    m.from={group:srcG.name,section:srcSecName,unit:srcUnitName};
  }
  destList.push(m);
  renderAll();
  toast('🔄 '+name+' を移動（異動をセット）');
}

function getMemberList(type,id){
  if(type==='sec'){const r=findSec(id);return r?r.s.members:null;}
  if(type==='unit'){const r=findUnit(id);return r?r.u.members:null;}
  return null;
}
function toggleRole(type,id,name,role){
  const members=getMemberList(type,id);if(!members)return;
  const m=members.find(x=>x.n===name);if(!m)return;
  const roles=m.r?m.r.split(',').filter(Boolean):[];
  const idx=roles.indexOf(role);
  if(idx>=0){if(roles.length>1)roles.splice(idx,1);}else roles.push(role);
  m.r=roles.join(',');renderAll();
}
function toggleKm(type,id,name){
  const members=getMemberList(type,id);if(!members)return;
  const m=members.find(x=>x.n===name);if(!m)return;
  m.km=!m.km;renderAll();
}
function setCh(type,id,name,ch){
  const members=getMemberList(type,id);if(!members)return;
  const m=members.find(x=>x.n===name);if(!m)return;
  m.ch=m.ch===ch?'':ch;
  if(m.ch!=='id')delete m.from;
  renderAll();
}
function delM(type,id,name){
  const members=getMemberList(type,id);if(!members)return;
  const idx=members.findIndex(x=>x.n===name);if(idx>=0)members.splice(idx,1);renderAll();
}
function addM(type,id){
  const inp=document.getElementById('ai_'+id);if(!inp)return;
  const name=inp.value.trim();if(!name)return;
  // マスタに存在しない名前は追加不可

    toast('❌「'+name+'」はマスタに未登録です。先に👥マスタタブで追加してください');

  const role=document.getElementById('ar_'+id)?.value||'member';

  members.push({n:name,r:role,km,ch});inp.value='';renderAll();
}
function addSec(gid){

  g.sections.push({id:uid(),name,members:[],units:[]});renderAll();

function delSec(sid){

function addUnit(sid){

// ── TREE ──
const ROW = 36;   // 1リーフ(メンバー)の行高さ
const GAP = 6;    // ノード間の余白

// ノードを描画。返り値 {html, leaves} leaves=占有リーフ数
function box(label, sub, opt){
  opt = opt || {};
  const border = opt.border || '#d0cdc5';
  const bg = opt.bg || '#fff';
  const tcolor = opt.color || '#1a1815';
  const w = opt.width || '150px';
  return '<div style="display:inline-flex;flex-direction:column;justify-content:center;width:' + w + ';box-sizing:border-box;height:' + (ROW-GAP) + 'px;padding:0 10px;border:1.5px solid ' + border + ';border-radius:6px;background:' + bg + ';font-size:11px;font-weight:700;color:' + tcolor + ';box-shadow:0 1px 2px rgba(0,0,0,.04);">'
    + '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + label + '</div>'
    + (sub ? '<div style="font-size:8px;font-weight:400;opacity:.65;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + sub + '</div>' : '')
    + '</div>';
}

function memberBox(m){
  const roles = m.r.split(',').filter(k=>k!=='member');
  const roleLabel = roles.length ? roles.map(k=>(ROLES_DEF.find(x=>x.k===k)?.l||k)).join('/') : '';
  const chColor = m.ch ? '#'+(CH_COLORS[m.ch]||'2563EB') : null;
  const chBg = m.ch ? (CH_COLORS[m.ch]?'#'+CH_COLORS[m.ch]+'22':'#dbeafe') : null;
  const km = m.km ? ' 〔兼〕' : '';
  const badgeColor = roles.length ? ('#'+(ROLE_COLORS[roles[0]]||'94A3B8')) : '';
  return '<div style="display:inline-flex;align-items:center;gap:5px;min-width:120px;box-sizing:border-box;height:' + (ROW-GAP) + 'px;padding:0 9px;border:1.5px solid ' + (chColor||'#e2dfd7') + ';border-radius:5px;background:' + (chBg||'#fff') + ';font-size:11px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.04);">'
    + (roleLabel ? '<span style="font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;color:#fff;background:' + badgeColor + ';">' + roleLabel + '</span>' : '')
    + '<span style="font-weight:' + (m.ch?'700':'500') + ';color:' + (chColor||'#1a1815') + ';">' + m.n + km + '</span>'
    + '</div>';
}

// 再帰: ノード(自分のボックスHTML) + 子配列[{boxHTML, leaves, render関数}] を受け取り
// 自分を子塊の先頭行に置き、コネクタつきで右に子を展開
// 戻り: {html, leaves}
function layoutNode(selfBoxHTML, childResults, lineColor){
  if(!childResults.length){
    return {html:'<div style="height:' + ROW + 'px;display:flex;align-items:center;">' + selfBoxHTML + '</div>', leaves:1};
  }
  const totalLeaves = childResults.reduce((a,c)=>a+c.leaves,0);
  const totalH = totalLeaves * ROW;

  let childCol = '<div style="display:flex;flex-direction:column;">';
  childResults.forEach(cr=>{ childCol += cr.html; });
  childCol += '</div>';

  // 各子の接続Y = その子塊の先頭行の中心。
  // 子塊は先頭にボックスがあるので、塊の開始Y + ROW/2 が接続点。
  let centers = [];
  let acc = 0;
  childResults.forEach(cr=>{
    centers.push(acc + ROW/2);   // 塊の先頭行の中心
    acc += cr.leaves*ROW;        // 次の塊へ
  });

  const SVGW = 34;
  const parentCenterY = ROW/2;
  const branchX = 16;
  let svg = '<svg width="' + SVGW + '" height="' + totalH + '" style="flex-shrink:0;display:block;">';
  // 親中心 → 縦線
  svg += '<line x1="0" y1="' + parentCenterY + '" x2="' + branchX + '" y2="' + parentCenterY + '" stroke="' + lineColor + '" stroke-width="2"/>';
  // 縦線
  const minY = Math.min(parentCenterY, centers[0]);
  const maxY = Math.max(parentCenterY, centers[centers.length-1]);
  svg += '<line x1="' + branchX + '" y1="' + minY + '" x2="' + branchX + '" y2="' + maxY + '" stroke="' + lineColor + '" stroke-width="2"/>';
  // 各子へ横線（ボックス左端=SVGW まで）
  centers.forEach(cy=>{ svg += '<line x1="' + branchX + '" y1="' + cy + '" x2="' + SVGW + '" y2="' + cy + '" stroke="' + lineColor + '" stroke-width="2"/>'; });
  svg += '</svg>';

  const html = '<div style="display:flex;align-items:flex-start;">'
    + '<div style="height:' + ROW + 'px;display:flex;align-items:center;flex-shrink:0;">' + selfBoxHTML + '</div>'
    + svg
    + childCol
  + '</div>';
  return {html, leaves: totalLeaves};
}

function renderTree(){
  const groupResults = D.groups.map((g,gi)=>{
    const c = gc(gi);
    const newBadge = '<span style="font-size:8px;font-weight:700;background:#ea580c;color:#fff;border-radius:3px;padding:1px 4px;margin-left:4px;">新設</span>';
    const secResults = g.sections.map(s=>{
      const sLabel = s.name + (s.ch==='new'?newBadge:'');
      if(s.units.length){
        const unitResults = s.units.map(u=>{
          const uLabel = u.name + (u.ch==='new'?newBadge:'');
          const memResults = rolesSorted(u.members).map(m=>layoutNode(memberBox(m),[],c));
          return layoutNode(box(uLabel,'',{border:u.ch==='new'?'#ea580c':c,color:c,width:'130px'}), memResults, c+'66');
        });
        const directMem = rolesSorted(s.members).map(m=>layoutNode(memberBox(m),[],c));
        return layoutNode(box(sLabel,'',{border:s.ch==='new'?'#ea580c':c,width:'145px'}), directMem.concat(unitResults), c+'88');
      } else {
        const memResults = rolesSorted(s.members).map(m=>layoutNode(memberBox(m),[],c));
        return layoutNode(box(sLabel,'',{border:s.ch==='new'?'#ea580c':c,width:'145px'}), memResults, c+'88');
      }
    });
    return layoutNode(box(g.name,g.sub,{border:c,color:c,width:'160px'}), secResults, c);
  });
  const divResult = layoutNode(box(D.divisionName,'',{bg:'#334155',color:'#fff',border:'#334155',width:'180px'}), groupResults, '#94a3b8');
  const compResult = layoutNode(box(D.companyName,'',{bg:'#1a1815',color:'#fff',border:'#1a1815',width:'150px'}), [divResult], '#334155');

  document.getElementById('treePanel').innerHTML =
    '<div id="treeCapture" style="padding:20px;overflow:auto;background:var(--bg);min-width:max-content;">'
    + '<div style="margin-bottom:16px;font-size:14px;font-weight:900;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">'
      + '<span>組織ツリー</span>'
      + '<span style="font-size:11px;font-weight:400;color:#666;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;"></span> 入社　<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb;"></span> 異動　<span class="km-badge" style="font-size:8px;">兼務中</span> 兼務</span>'
      + '<button class="btn btn-g" id="dlTreeBtn" style="margin-left:auto;" onclick="downloadTreeImage()">🖼 画像DL</button>'
    + '</div>'
    + '<div style="display:inline-block;">' + compResult.html + '</div>'
    + '</div>';
}

async function dlPptx(gi){
  const g=D.groups[gi];if(!g)return;
  if(typeof PptxGenJS==='undefined'){toast('❌ PPTXライブラリが読み込めていません。ページを再読込してください');return;}
  toast('⏳ PPTX生成中...');
  try{
    const GCx=['E8521A','2563EB','16A34A','9333EA','0891B2','CA8A04','DC2626','0D9488'];
    const colorHex=GCx[gi%GCx.length];
    // 変更区分の色・ラベルは動的（新設は固定追加）
    const CH_COLOR=Object.assign({new:'EA580C'}, CH_COLORS);
    const CH_LABEL=Object.assign({new:'新設'}, Object.fromEntries(CH_DEF.map(c=>[c.k,c.l])));
    const FS=11;
    const sortFn=(a,b)=>ROLE_ORDER.indexOf(a.r.split(',')[0])-ROLE_ORDER.indexOf(b.r.split(',')[0]);

    const pres=new PptxGenJS();
    pres.defineLayout({name:'W16x9',width:10,height:5.625});
    pres.layout='W16x9';
    const slide=pres.addSlide();
    slide.background={color:'FFFFFF'};

    // タイトル
    slide.addShape(pres.shapes.RECTANGLE,{x:0,y:0,w:0.16,h:5.625,fill:{color:colorHex},line:{type:'none'}});
    slide.addText(g.name,{x:0.35,y:0.16,w:9,h:0.5,fontSize:24,fontFace:'Noto Sans JP',bold:true,color:colorHex,margin:0});
    const today=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
    const metaText=[g.sub,(ARCHIVES[curArchive]?.label||''),today].filter(Boolean).join('　');
    slide.addText(metaText,{x:0.36,y:0.62,w:9.3,h:0.26,fontSize:10,fontFace:'Noto Sans JP',color:'888888',margin:0});

    // 変更サマリー（全変更区分を集計）
    const all=allMembers(g);
    const changes=CH_DEF.map(c=>({k:c.k,n:all.filter(m=>m.ch===c.k).length})).filter(c=>c.n>0);
    if(changes.length){
      const sr=[];
      changes.forEach((c,i)=>{
        sr.push({text:CH_LABEL[c.k]+' '+c.n+'名',options:{fontSize:10,bold:true,color:CH_COLOR[c.k]||'2563EB',fontFace:'Noto Sans JP'}});
        if(i<changes.length-1)sr.push({text:'　/　',options:{fontSize:10,color:'CCCCCC',fontFace:'Noto Sans JP'}});
      });
      slide.addText(sr,{x:0.36,y:0.9,w:9.3,h:0.24,margin:0});
    }

    // メンバーのリッチテキスト生成（役職バッジ＋兼務）。memberだけ無印、他はバッジ
    const memberRich=(members)=>{
      const sorted=[...members].sort(sortFn);
      const rich=[];
      sorted.forEach((m,mi)=>{
        const roles=m.r.split(',').filter(k=>k!=='member');
        const chColor=m.ch?(CH_COLOR[m.ch]||'2563EB'):null;
        roles.forEach(k=>{const def=ROLES_DEF.find(x=>x.k===k);if(!def)return;rich.push({text:'['+def.l+']',options:{fontSize:FS-2,bold:true,color:ROLE_COLORS[k]||'94A3B8',fontFace:'Noto Sans JP'}});rich.push({text:' ',options:{fontSize:FS,fontFace:'Noto Sans JP'}});});
        const suffix=m.km?'〔兼〕':'';
        rich.push({text:m.n+suffix,options:{fontSize:FS,bold:!!m.ch,color:chColor||'1A1815',fontFace:'Noto Sans JP'}});
        if(mi<sorted.length-1)rich.push({text:'　',options:{fontSize:FS,fontFace:'Noto Sans JP'}});
      });
      if(rich.length===0)rich.push({text:'未配置',options:{fontSize:FS,color:'CCCCCC',fontFace:'Noto Sans JP'}});
      return rich;
    };

    // 行データを構築（画面と同じ：チーム見出し＋直属/ユニット行）
    // rows: [{type:'teamHeader', name, isNew} | {type:'bar', label, labelColor, members, isNew}]
    const rows=[];
    g.sections.forEach(s=>{
      if(s.units.length>0){
        // チーム見出し行
        rows.push({type:'header', name:s.name, isNew:s.ch==='new'});
        // 直属メンバーがいれば「直属」バー
        if(s.members.length>0){
          rows.push({type:'bar', label:'（直属）', labelColor:'9CA3AF', members:s.members, isNew:false});
        }
        // 各ユニット
        s.units.forEach(u=>{
          rows.push({type:'bar', label:u.name, labelColor:(u.ch==='new'?'EA580C':colorHex), members:u.members, isNew:u.ch==='new'});
        });
      } else {
        // ユニットなし：チーム名ラベルのバー
        rows.push({type:'bar', label:s.name, labelColor:(s.ch==='new'?'EA580C':colorHex), members:s.members, isNew:s.ch==='new'});
      }
    });

    // レイアウト
    const TOP=1.28, LEFT=0.3, TOTAL_W=9.4, LABEL_W=1.6;
    const GAPv=0.08, HEADER_H=0.28;
    const AREA_H=5.5-TOP;
    // 行高さを行数で決定（最小0.34, 最大0.62）
    const barRows=rows.filter(r=>r.type==='bar').length;
    const headerRows=rows.filter(r=>r.type==='header').length;
    const usableH=AREA_H - headerRows*(HEADER_H+GAPv) - (rows.length-1)*GAPv;
    let barH=Math.min(0.62, Math.max(0.32, usableH/Math.max(barRows,1)));

    let y=TOP;
    rows.forEach(r=>{
      if(r.type==='header'){
        const label=r.name+(r.isNew?'　【新設】':'');
        slide.addShape(pres.shapes.RECTANGLE,{x:LEFT,y,w:0.06,h:HEADER_H,fill:{color:colorHex},line:{type:'none'}});
        slide.addText(label,{x:LEFT+0.1,y,w:TOTAL_W-0.1,h:HEADER_H,fontSize:FS+1,bold:true,color:colorHex,fontFace:'Noto Sans JP',valign:'middle',margin:0});
        y+=HEADER_H+GAPv;
      } else {
        // 左ラベル
        slide.addShape(pres.shapes.RECTANGLE,{x:LEFT,y,w:LABEL_W,h:barH,fill:{color:r.labelColor},line:{type:'none'}});
        slide.addText(r.label,{x:LEFT,y,w:LABEL_W,h:barH,fontSize:FS,bold:true,color:'FFFFFF',fontFace:'Noto Sans JP',align:'center',valign:'middle',margin:1});
        // 右メンバー
        const memX=LEFT+LABEL_W, memW=TOTAL_W-LABEL_W;
        slide.addShape(pres.shapes.RECTANGLE,{x:memX,y,w:memW,h:barH,fill:{color:'FAFAF8'},line:{color:'E2DFD7',width:1}});
        slide.addText(memberRich(r.members),{x:memX+0.12,y,w:memW-0.24,h:barH,fontFace:'Noto Sans JP',valign:'middle',align:'left',margin:1,wrap:true,fit:'shrink'});
        y+=barH+GAPv;
      }
    });

    await pres.writeFile({fileName:g.name+'.pptx'});
    toast('✅ PPTXをダウンロードしました');
  }catch(e){toast('❌ PPTX生成エラー: '+e.message);}
}

      <div class="sll"><span class="sl-km-mark">兼</span>兼務中</div>

  </div>`;
}

function renderHarel(){
  syncDToArchive();
  // フラグで「誰を出すか」決定。異動前は前月アーカイブから自動補完
  const prevArchive = curArchive > 0 ? ARCHIVES[curArchive-1] : null;
  // 前月の各人の所属マップ（名前→主所属。複数あればkm=falseを優先）
  function buildPrevMap(groups){
    const map={};
    (groups||[]).forEach(g=>g.sections.forEach(s=>{
      const add=(m,unitName)=>{
        if(!map[m.n]||(!m.km&&map[m.n].km)){
          map[m.n]={group:g.name,section:s.name,unit:unitName||'',km:!!m.km};
        }
      };
      s.members.forEach(m=>add(m,''));
      (s.units||[]).forEach(u=>u.members.forEach(m=>add(m,u.name)));
    }));
    return map;
  }
  const prevMap = prevArchive ? buildPrevMap(prevArchive.groups) : null;

  // 変更区分ごとに人を集める（kmは別枠）
  const byCh = {}; CH_DEF.forEach(c=>byCh[c.k]=[]);
  const kenmu=[];
  D.groups.forEach(g=>g.sections.forEach(s=>{
    const scan=(m,unitName)=>{
      const base={name:m.n,role:rl(m.r),group:g.name,section:s.name,unit:unitName||''};
      if(m.ch && byCh[m.ch]){
        // 異動前情報：移動時の記録を優先、なければ前月から補完
        let fromG='',fromS='',fromU='';
        if(m.from){fromG=m.from.group||'';fromS=m.from.section||'';fromU=m.from.unit||'';}
        else if(prevMap && prevMap[m.n]){fromG=prevMap[m.n].group;fromS=prevMap[m.n].section;fromU=prevMap[m.n].unit;}
        byCh[m.ch].push({...base,fromGroup:fromG,fromSection:fromS,fromUnit:fromU});
      }
      if(m.km)kenmu.push(base);
    };
    s.members.forEach(m=>scan(m,''));
    s.units.forEach(u=>u.members.forEach(m=>scan(m,u.name)));
  }));

  // 新設チーム/ユニット
  const newOrgs=[];
  D.groups.forEach(g=>g.sections.forEach(s=>{
    if(s.ch==='new')newOrgs.push({type:'チーム',group:g.name,name:s.name});
    s.units.forEach(u=>{if(u.ch==='new')newOrgs.push({type:'ユニット',group:g.name,name:s.name+' / '+u.name});});
  }));

  const totalFlags=Object.values(byCh).reduce((a,arr)=>a+arr.length,0)+kenmu.length;
  const prevNote=prevArchive?`異動前の所属は前月「${prevArchive.label}」から自動補完しています。`:'前月アーカイブがないため、異動前はドラッグ移動の記録のみ表示します。';
  const note = totalFlags>0
    ? `✅ フラグが付いた人だけを表示（合計${totalFlags}件）。${prevNote}`
    : `まだフラグが付いた人がいません。編集タブで変更区分フラグを付けるか、メンバーをドラッグ移動すると、ここに表示されます。`;

  // 各変更区分のセクションを動的生成
  const isIdLike=(k)=>{const c=CH_DEF.find(x=>x.k===k);return c&&(c.l.includes('異動')||k==='id');};
  let sections='';
  CH_DEF.forEach(c=>{
    const rows=byCh[c.k];
    if(isIdLike(c.k)){
      sections+=hSec(c.l+'者','id',rows,
        [c.l+'者','社員番号','メールアドレス','異動前：部署','異動前：チーム','異動前：ユニット','異動後：部署','チーム','ユニット','役職'],
        r=>[r.name,'','',r.fromGroup||'',r.fromSection||'',r.fromUnit||'',r.group,r.section,r.unit,r.role]);
    } else {
      sections+=hSec(c.l+'者',(c.k==='ny'?'ny':'id'),rows,
        [c.l+'者','社員番号','メールアドレス','部署','部門コード','チーム','ユニット','役職','備考'],
        r=>[r.name,'','',r.group,'',r.section,r.unit,r.role,'']);
    }
  });

  document.getElementById('harelPanel').innerHTML=`
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:11px;flex-wrap:wrap;">
      <div style="font-size:17px;font-weight:900;">📋 発令案（${ARCHIVES[curArchive]?.label||''}）</div>
      <button class="btn btn-warn" onclick="clearChanges()">🔄 全フラグをリセット</button>
    </div>
    <div style="background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:9px 14px;font-size:11px;color:#15803d;line-height:1.6;margin-bottom:12px;">${note}</div>
    <div class="hn">💡「行コピー」→ スプレッドシートにそのままペースト（タブ区切り）。発令案はフラグが付いた人だけ表示します。</div>
    ${newOrgs.length?`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:9px 14px;font-size:11px;color:#9a3412;margin-bottom:12px;"><strong>🆕 新設組織：</strong>${newOrgs.map(o=>o.type+'「'+o.name+'」（'+o.group+'）').join('、')}</div>`:''}
    ${sections}
    ${hSec('兼務者','km',kenmu,
      ['兼務者','社員番号','メールアドレス','兼務先：部署','チーム','ユニット','役職'],
      r=>[r.name,'','',r.group,r.section,r.unit,r.role])}`;
}
function hSec(title,cls,rows,cols,fn){
  const tid='ht_'+cls+'_'+title.replace(/[^a-zA-Z0-9]/g,'');
  return `<div class="hs">
    <div class="hsh">
      <div class="hb ${cls}">${title}　${rows.length}名</div>
      ${rows.length?`<button class="cab" onclick="cpAll('${tid}')">全行コピー</button>`:''}
    </div>
    ${!rows.length?`<div class="emp">該当者なし</div>`:
    `<table class="ht" id="${tid}">
      <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows.map((r,i)=>{const cells=fn(r);return`<tr>${cells.map(c=>`<td>${c}</td>`).join('')}<td><button class="cr" onclick="cpRow('${tid}',${i})">コピー</button></td></tr>`;}).join('')}</tbody>
    </table>`}
  </div>`;
}
function cpAll(tid){
  const t=document.getElementById(tid);if(!t)return;
  navigator.clipboard.writeText([...t.querySelectorAll('tbody tr')].map(r=>[...r.querySelectorAll('td:not(:last-child)')].map(c=>c.textContent).join('\t')).join('\n')).then(()=>toast('📋 コピーしました'));
}
function cpRow(tid,i){
  const t=document.getElementById(tid);if(!t)return;
  const row=t.querySelectorAll('tbody tr')[i];if(!row)return;
  navigator.clipboard.writeText([...row.querySelectorAll('td:not(:last-child)')].map(c=>c.textContent).join('\t')).then(()=>toast('📋 コピーしました'));
}

      <thead><tr><th>表示名</th><th>バッジ色</th><th>並び順</th><th></th></tr></thead>
      <tbody>
        ${ROLES_DEF.map((r,i)=>`<tr>

          </td>

        </tr>`).join('')}
      </tbody>
    </table>
    <div style="display:flex;gap:6px;margin-top:8px;max-width:560px;">
      <input id="newRoleLabel" placeholder="新しい役職名（例: インターン）" style="flex:1;padding:6px 9px;border:1.5px solid var(--bor);border-radius:6px;font-size:12px;font-family:inherit;" onkeydown="if(event.key==='Enter')addRole()">
      <button class="btn btn-p" onclick="addRole()">＋ 役職を追加</button>
    </div>

    <div style="font-size:15px;font-weight:900;margin:24px 0 10px;">🔖 変更区分の管理</div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:8px;">発令案に出す区分です（入社・異動のほか、出向・昇格などを追加できます）。</div>
    <table class="master-table" style="max-width:480px;">
      <thead><tr><th>表示名</th><th>色</th><th></th></tr></thead>
      <tbody>
        ${CH_DEF.map(c=>`<tr>
          <td><input value="${c.l}" onchange="updChLabel('${c.k}',this.value)"></td>

      <button class="btn btn-p" onclick="addCh()">＋ 区分を追加</button>

}
// 役職管理
function updRoleLabel(k,v){const r=ROLES_DEF.find(x=>x.k===k);if(r)r.l=v;syncDefsToD();autosave();}
function updRoleColor(k,v){ROLE_COLORS[k]=v.replace('#','').toUpperCase();syncDefsToD();autosave();renderAll();}
function moveRole(i,dir){
  const j=i+dir;if(j<0||j>=ROLES_DEF.length)return;
  [ROLES_DEF[i],ROLES_DEF[j]]=[ROLES_DEF[j],ROLES_DEF[i]];
  ROLE_ORDER=ROLES_DEF.map(r=>r.k);
  syncDefsToD();renderMaster();autosave();
}
function delRole(k){
  if(ROLES_DEF.length<=1)return;
  if(!confirm('この役職を削除しますか？（既存メンバーの役職からは外れます）'))return;
  ROLES_DEF=ROLES_DEF.filter(x=>x.k!==k);
  ROLE_ORDER=ROLES_DEF.map(r=>r.k);delete ROLE_COLORS[k];
  syncDefsToD();renderMaster();autosave();
}
function addRole(){
  const inp=document.getElementById('newRoleLabel');const label=inp.value.trim();if(!label)return;
  const k='r'+uid();
  ROLES_DEF.push({k,l:label});ROLE_ORDER.push(k);ROLE_COLORS[k]='94A3B8';
  syncDefsToD();renderMaster();autosave();toast('役職「'+label+'」を追加しました');
}
// 変更区分管理
function updChLabel(k,v){const c=CH_DEF.find(x=>x.k===k);if(c)c.l=v;syncDefsToD();autosave();}
function updChColor(k,v){CH_COLORS[k]=v.replace('#','').toUpperCase();syncDefsToD();autosave();renderAll();}
function delCh(k){
  if(!confirm('この変更区分を削除しますか？'))return;
  CH_DEF=CH_DEF.filter(x=>x.k!==k);delete CH_COLORS[k];
  syncDefsToD();renderMaster();autosave();
}
function addCh(){
  const inp=document.getElementById('newChLabel');const label=inp.value.trim();if(!label)return;
  const k='c'+uid();
  CH_DEF.push({k,l:label});CH_COLORS[k]='9333EA';
  syncDefsToD();renderMaster();autosave();toast('変更区分「'+label+'」を追加しました');
}
function updMaster(id,field,val){const m=D.master.find(x=>x.id===id);if(m)m[field]=val;}
function delMasterRow(id){D.master=D.master.filter(x=>x.id!==id);renderMaster();}
function addMasterRow(){
  D.master.push({id:uid(),name:'',dept:'',defaultRole:'member'});
  masterFilter='';renderMaster();
  setTimeout(()=>{const rows=document.querySelectorAll('.master-table tbody tr');if(rows.length)rows[rows.length-1].querySelector('input')?.focus();},50);
}

// ── EXPORT/IMPORT ──
function exportD(){
  syncDToArchive();
  const payload = { __archives: ARCHIVES, __cur: curArchive };
  const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`natee-org-${new Date().toISOString().slice(0,10)}.json`;a.click();
  toast('💾 全'+ARCHIVES.length+'ヶ月分を保存しました');
}
function loadF(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{
    const parsed=JSON.parse(ev.target.result);
    if(parsed.__archives){
      // 新形式（複数月）
      ARCHIVES = parsed.__archives;
      curArchive = parsed.__cur || 0;
      loadArchiveToD(curArchive);
    } else {
      // 旧形式（単一データ）→ 1ヶ月として取り込み
      D = parsed;
      initArchives();
    }
    aG = D.groups[0]?.id || '';
    slideIdx = 0;
    renderArchiveBar();
    renderAll();
    autosave();
    const labels = ARCHIVES.map(a=>a.label).join('・');
    toast('📂 読込完了：'+labels);
  } catch(err){toast('❌ ファイル形式エラー: '+err.message);}};
  r.readAsText(f);e.target.value='';
}

// ── ツリー画像DL ──
function downloadTreeImage(){
  const target = document.getElementById('treeCapture') || document.getElementById('treePanel');
  const btn = document.getElementById('dlTreeBtn');
  if(btn) btn.style.display='none';
  html2canvas(target, {
    backgroundColor: '#f2f1ed',
    scale: 2,
    useCORS: true,
    scrollX: 0,
    scrollY: 0,
    width: target.scrollWidth,
    height: target.scrollHeight,
    windowWidth: target.scrollWidth + 200,
  }).then(canvas => {
    if(btn) btn.style.display='';
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'natee-org-tree-' + new Date().toISOString().slice(0,10) + '.png';
    a.click();
    toast('🖼 ツリー画像をダウンロードしました');
  }).catch(e => {
    if(btn) btn.style.display='';
    toast('❌ 画像DLエラー: ' + e.message);
  });
}
